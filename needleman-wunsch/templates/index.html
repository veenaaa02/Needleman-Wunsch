<!DOCTYPE html>
<html>
    <head>
        <title>NEEDLEMAN-WUNSCH</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <style>
        h1{
            font-family:"Comic Sans MS",cursive,sans-serif;
            margin-left: 160px;
            font-weight: 400;
            font-style: initial;
            animation:fadeDown 1.2s ease;
        }
        @keyframes fadeDown{
        from{
            opacity:0;
            transform:translateY(-40px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
        }
        body{
        background: linear-gradient(-45deg,#aed0e2,#c8e8f2,#b5dff0,#d5eef7);
        background-size:400% 400%;
        animation: gradientBG 15s ease infinite;
        font-family:"Comic Sans MS",cursive, sans-serif;
        font-size:larger;
        }
        @keyframes gradientBG{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }
        input[type="text"],
        input[type="number"]{
            margin-left: 60px;
            background-color: #c4e2e6;
            border: 2px solid #CBD5E1;
            width:180px;
            padding:8px 10px;
            border-radius:9px;
            font-size:14px;
            transition:0.3s;
            margin-bottom:10px;
        }
        input[type="text"]:focus,
        input[type="number"]:focus{
            outline:none;
            border-color:rgb(140, 190, 234);
            box-shadow:rgb(35, 53, 69);
        }
        input[type="submit"]{
            margin-left: 500px;
            margin-bottom: 60px;
            background:#67acc6;
            color:black;
            border:none;
            padding:8px 18px;
            border-radius:10px;
            font-size:14px;
            cursor:pointer;
            transition:0.3s;
        }
        input[type="submit"]:hover{
            transform:scale(1.05);
        }
        label{
            margin-left: 60px;
        }
        .animation-right{
            position: absolute;
            top: 40px;          
            right: -50px;
            width: 65%;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; 
        }
        #dna-animation{
            width:500%;
            height:500%;
            transform: rotate(10deg);
        }
    </style>
    </head>
    <body>
        <h1>Needleman -Wunsch Sequence Alignment</h1>
        {% if error%}
            <p><strong>{{error}}</strong></p>
        {% endif %}
        <form action="/align" method="POST">
            <label>Sequence 1</label>
            <input type="text" name="seq1">
            <br><br>
            <label>Sequence 2</label>
            <input type="text" name="seq2">
            <br><br>
            <label>Match</label>
            <input type="number" name="match">
            <br><br>
            <label>Mismatch</label>
            <input type="number" name="mismatch">
            <br><br>
            <label>Gap Penalty</label>
            <input type="number" name="gap">
            <br><br>
            <input type="submit" value="  Align  ">
        </form>
    <div class="animation-right">
        <div id="dna-animation"></div>
    </div>
    <script>
        lottie.loadAnimation({
        container: document.getElementById("dna-animation"),
        renderer: "svg",
        loop: true,
        autoplay: true,
        path: "{{ url_for('static', filename='DNA.json') }}"
    });
    </script>
    </body>
</html>
